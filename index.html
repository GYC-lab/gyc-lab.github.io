    <title>六一儿童节快乐</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #26384f;
        --muted: rgba(38, 56, 79, 0.68);
        --soft: rgba(255, 255, 255, 0.68);
        --line: rgba(73, 110, 143, 0.22);
        --gold: #ffbe45;
        --gold-strong: #ff8f66;
        --sea: #42bdb3;
        --deep: #fff8df;
        --night: #dff7ff;
        --pink: #ff8fb8;
        --blue: #6cc8ff;
        --green: #8edb75;
        --shadow: rgba(86, 113, 142, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Microsoft YaHei",
          "PingFang SC",
          "Hiragino Sans GB",
          system-ui,
          sans-serif;
        background: var(--deep);
        color: var(--ink);
        letter-spacing: 0;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .page {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        background:
          linear-gradient(180deg, #fff9df 0%, #dbf7ff 52%, #fff2f7 100%);
      }

      .page::before,
      .page::after {
        content: "";
        position: fixed;
        pointer-events: none;
      }

      .page::before {
        inset: -8%;
        z-index: 0;
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 210, 95, 0.46), transparent 24%),
          radial-gradient(circle at 74% 12%, rgba(114, 202, 255, 0.5), transparent 27%),
          radial-gradient(circle at 82% 68%, rgba(255, 143, 184, 0.38), transparent 28%),
          radial-gradient(circle at 18% 78%, rgba(126, 219, 117, 0.3), transparent 25%);
        transform: translate3d(-1%, -1%, 0) scale(1.06);
        animation: background-drift 28s ease-in-out infinite alternate;
        will-change: transform;
      }

      .page::after {
        inset: 0;
        z-index: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.5) 54%, rgba(255, 249, 230, 0.76) 100%),
          repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0 2px, transparent 2px 18px);
      }

      .bubbles {
        position: fixed;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        pointer-events: none;
      }

      .bubble {
        position: absolute;
        bottom: -18vh;
        left: var(--left);
        width: var(--size);
        aspect-ratio: 1;
        border: 1px solid var(--bubble-line);
        border-radius: 50%;
        background:
          radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.94) 0 10%, transparent 12%),
          radial-gradient(circle at 70% 76%, rgba(255, 255, 255, 0.36), transparent 32%),
          var(--bubble-fill);
        box-shadow:
          inset 0 0 18px rgba(255, 255, 255, 0.52),
          0 8px 24px var(--bubble-glow);
        opacity: 0;
        transform: translate3d(0, 0, 0) scale(0.74);
        animation: float-bubble var(--duration) linear infinite;
        animation-delay: var(--delay);
        filter: saturate(1.12);
        will-change: transform, opacity;
      }

      .bubble::after {
        content: "";
        position: absolute;
        top: 22%;
        left: 26%;
        width: 24%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.74);
      }

      @keyframes background-drift {
        0% {
          transform: translate3d(-1%, -1%, 0) scale(1.06);
        }

        50% {
          transform: translate3d(1.4%, 0.8%, 0) scale(1.1);
        }

        100% {
          transform: translate3d(-0.4%, -2.8%, 0) scale(1.07);
        }
      }

      @keyframes float-bubble {
        0% {
          opacity: 0;
          transform: translate3d(0, 0, 0) scale(0.72);
        }

        12% {
          opacity: 0.76;
        }

        50% {
          transform: translate3d(var(--sway), -56vh, 0) scale(1);
        }

        88% {
          opacity: 0.68;
        }

        100% {
          opacity: 0;
          transform: translate3d(calc(var(--sway) * -0.72), -116vh, 0) scale(1.14);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .page::before {
          animation: none;
        }

        .bubbles {
          display: none;
        }
      }

      .shell {
        position: relative;
        z-index: 2;
        display: grid;
        min-height: 100vh;
        grid-template-rows: minmax(430px, 1fr) auto;
      }

      .hero {
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: min(100%, 980px);
        padding: clamp(28px, 6vw, 72px);
      }

      .kicker {
        width: fit-content;
        margin: 0 0 18px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 172, 64, 0.45);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        color: #d36f18;
        font-size: clamp(13px, 2vw, 15px);
        line-height: 1;
        box-shadow: 0 10px 30px rgba(255, 176, 48, 0.18);
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        font-size: clamp(52px, 13vw, 128px);
        line-height: 0.92;
        font-weight: 800;
        color: #263f62;
        text-wrap: balance;
        text-shadow: 0 10px 34px rgba(97, 138, 166, 0.22);
      }

      .subtitle {
        max-width: 680px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(17px, 3.8vw, 26px);
        line-height: 1.55;
        text-shadow: 0 4px 18px rgba(255, 255, 255, 0.74);
      }

      .gift {
        width: min(100% - 24px, 920px);
        margin: 0 auto clamp(16px, 4vw, 34px);
        padding: clamp(18px, 4vw, 30px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 24px 68px rgba(90, 128, 160, 0.18);
        backdrop-filter: blur(18px) saturate(1.12);
      }

      .message {
        margin: 0 0 20px;
        color: var(--ink);
        font-size: clamp(18px, 4vw, 26px);
        line-height: 1.58;
      }

      .player {
        margin: 0 0 18px;
        padding: 16px;
        border: 1px solid rgba(86, 177, 204, 0.24);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.64);
      }

      .track {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .track-label {
        color: var(--ink);
        font-size: 15px;
        font-weight: 700;
      }

      .track-status {
        color: var(--muted);
        font-size: 13px;
        text-align: right;
      }

      .progress {
        position: relative;
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(90, 128, 160, 0.14);
      }

      .progress-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .time-label {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .progress span {
        display: block;
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--pink), var(--gold), var(--sea));
        transition: width 120ms linear;
      }

      .lyrics-panel {
        margin-top: 12px;
        padding: 16px;
        min-height: clamp(320px, 38vh, 520px);
        max-height: clamp(420px, 48vh, 700px);
        overflow: auto;
        border: 1px solid rgba(86, 177, 204, 0.22);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.58);
      }

      .lyrics-panel pre {
        margin: 0;
        color: rgba(38, 56, 79, 0.88);
        font: inherit;
        font-size: clamp(15px, 1.8vw, 17px);
        line-height: 1.9;
        white-space: pre-wrap;
      }

      .lyrics-panel::-webkit-scrollbar {
        width: 8px;
      }

      .lyrics-panel::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: rgba(255, 143, 184, 0.42);
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .action {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.68);
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 8px 22px rgba(90, 128, 160, 0.1);
        transition:
          transform 160ms ease,
          background 160ms ease,
          border-color 160ms ease;
      }

      .action:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 143, 184, 0.46);
        background: rgba(255, 255, 255, 0.86);
      }

      .action.primary {
        border-color: rgba(255, 173, 67, 0.5);
        background: linear-gradient(135deg, #ffe072, #ffb15f 52%, #ff8fb8);
        color: #482412;
        font-weight: 700;
      }

      .action svg {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        z-index: 6;
        width: max-content;
        max-width: min(88vw, 420px);
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        color: var(--ink);
        box-shadow: 0 18px 44px rgba(90, 128, 160, 0.22);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 16px);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      dialog {
        width: min(92vw, 520px);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0;
        background: #fffef7;
        color: var(--ink);
        box-shadow: 0 30px 90px rgba(90, 128, 160, 0.3);
      }

      dialog::backdrop {
        background: rgba(96, 128, 152, 0.28);
      }

      .dialog-inner {
        padding: 22px;
      }

      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .dialog-head h2 {
        margin: 0;
        font-size: 20px;
      }

      .close {
        display: inline-grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.7);
        color: var(--ink);
        cursor: pointer;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 14px;
      }

      label {
        color: var(--muted);
        font-size: 14px;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.78);
        color: var(--ink);
        outline: none;
      }

      textarea {
        min-height: 104px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        border-color: rgba(118, 209, 201, 0.75);
        box-shadow: 0 0 0 3px rgba(108, 200, 255, 0.18);
      }

      .dialog-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }

      @media (max-width: 680px) {
        .shell {
          grid-template-rows: minmax(330px, 0.82fr) auto;
        }

        .hero {
          padding: 28px 22px 42px;
        }

        .actions {
          grid-template-columns: 1fr 1fr;
        }

        .lyrics-panel {
          min-height: 300px;
          max-height: 52vh;
        }

        .action {
          min-height: 46px;
          font-size: 14px;
        }
      }

      @media (max-width: 390px) {
        .actions,
        .dialog-actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="bubbles" aria-hidden="true">
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
      </div>
      <div class="shell">
        <section class="hero" aria-label="儿童节祝福开场">
          <p class="kicker" id="recipient">儿童节小礼物</p>
          <h1>六一儿童节快乐</h1>
          <p class="subtitle">
            愿今天的你，像小时候一样明亮、自在、好奇。
          </p>
        </section>

        <section class="gift" aria-label="儿童节音乐礼物">
          <p class="message" id="message">
            这首《萤火》送给你，让今天的祝福在歌声里慢慢亮起来。
          </p>

          <div class="player" aria-label="歌曲播放器">
            <div class="track">
              <span class="track-label">TFBOYS《萤火》</span>
              <span class="track-status" id="trackStatus">打开即播放</span>
            </div>
            <div class="progress" id="progressBar" role="progressbar" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span id="progressFill"></span>
            </div>
            <div class="progress-meta">
              <span>播放进度</span>
              <span class="time-label" id="timeLabel">00:00 / 00:00</span>
            </div>
            <div class="lyrics-panel" aria-label="完整歌词展示区">
              <pre id="lyricsText">请添加授权歌词文件 lyrics.txt 或 lyrics.lrc</pre>
            </div><audio id="audio" preload="auto" autoplay playsinline src="/assets/firefly-gift/yinghuo.mp3"></audio>
          </div>

          <div class="actions">
            <button class="action primary" type="button" id="playBtn">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path id="playIcon" d="M8 5v14l11-7-11-7Z" fill="currentColor" />
              </svg>
              <span id="playLabel">播放</span>
            </button>
            <a class="action" id="songLink" href="https://y.qq.com/n/ryqq/search?w=TFBOYS%20%E8%90%A4%E7%81%AB" target="_blank" rel="noreferrer">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M14 3h7v7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M10 14 21 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              平台入口
            </a>
            <button class="action" type="button" id="copyBtn">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              复制文案
            </button>
            <button class="action" type="button" id="shareBtn">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path d="M16 6 12 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M12 2v13" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              分享
            </button>
            <button class="action" type="button" id="customBtn">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path d="m16.5 3.5 4 4L8 20H4v-4L16.5 3.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
              </svg>
              定制
            </button>
          </div>
        </section>
      </div>
    </main>

    <dialog id="editor">
      <form class="dialog-inner" method="dialog">
        <div class="dialog-head">
          <h2>定制这张小卡</h2>
          <button class="close" value="cancel" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <div class="field">
          <label for="toInput">收件人</label>
          <input id="toInput" name="to" maxlength="24" autocomplete="off" />
        </div>
        <div class="field">
          <label for="msgInput">留言</label>
          <textarea id="msgInput" name="msg" maxlength="90"></textarea>
        </div>

        <div class="dialog-actions">
          <button class="action primary" type="button" id="saveBtn">更新小卡</button>
          <button class="action" type="button" id="copyLinkBtn">复制链接</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const defaults = {
        to: "儿童节小礼物",
        msg: "这首《萤火》送给你，让今天的祝福在歌声里慢慢亮起来。",
      };

      const params = new URLSearchParams(window.location.search);
      const state = {
        to: params.get("to") || defaults.to,
        msg: params.get("msg") || defaults.msg,
      };

      const recipient = document.querySelector("#recipient");
      const message = document.querySelector("#message");
      const toast = document.querySelector("#toast");
      const editor = document.querySelector("#editor");
      const toInput = document.querySelector("#toInput");
      const msgInput = document.querySelector("#msgInput");
      const audio = document.querySelector("#audio");
      const playBtn = document.querySelector("#playBtn");
      const playLabel = document.querySelector("#playLabel");
      const playIcon = document.querySelector("#playIcon");
      const trackStatus = document.querySelector("#trackStatus");
      const progressBar = document.querySelector("#progressBar");
      const progressFill = document.querySelector("#progressFill");
      const timeLabel = document.querySelector("#timeLabel");
      const lyricsText = document.querySelector("#lyricsText");
      const songLink = document.querySelector("#songLink").href;
      let autoplayStarted = false;
      let autoplayBlockedToastShown = false;
      let autoplayAttempts = 0;

      function applyState() {
        recipient.textContent = state.to;
        message.textContent = state.msg;
        toInput.value = state.to;
        msgInput.value = state.msg;
      }

      function currentUrl() {
        const url = new URL(window.location.href);
        url.searchParams.set("to", state.to);
        url.searchParams.set("msg", state.msg);
        return url.toString();
      }

      function giftText(includePageLink = true) {
        const lines = [
          `送你一首 TFBOYS 的《萤火》。`,
          state.msg,
          `听歌：${songLink}`,
        ];
        if (includePageLink) lines.push(`小卡：${currentUrl()}`);
        return lines.join("\n");
      }

      async function copyText(text, label) {
        try {
          await navigator.clipboard.writeText(text);
          showToast(label);
        } catch {
          showToast("当前浏览器不支持直接复制");
        }
      }

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2100);
      }

      function formatTime(value) {
        if (!Number.isFinite(value) || value <= 0) return "00:00";
        const totalSeconds = Math.floor(value);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = String(totalSeconds % 60).padStart(2, "0");
        return `${minutes}:${seconds}`;
      }

      function updateProgress() {
        const current = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
        const duration = Number.isFinite(audio.duration) ? audio.duration : 0;
        const percent = duration > 0 ? Math.min((current / duration) * 100, 100) : 0;
        progressFill.style.width = `${percent}%`;
        progressBar.setAttribute("aria-valuenow", String(Math.round(percent)));
        timeLabel.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
      }

      function setPlayButton(isPlaying) {
        playLabel.textContent = isPlaying ? "暂停" : "播放";
        playIcon.setAttribute(
          "d",
          isPlaying ? "M7 5h4v14H7V5Zm6 0h4v14h-4V5Z" : "M8 5v14l11-7-11-7Z",
        );
      }

      async function startAudio(isAutoplay = false) {
        if (audio.error) {
          trackStatus.textContent = "等待音频文件";
          showToast("把音频文件放到 assets/firefly-gift/yinghuo.mp3 后即可直接播放");
          return false;
        }

        try {
          await audio.play();
          autoplayStarted = true;
          return true;
        } catch (error) {
          setPlayButton(false);
          const blocked = error && error.name === "NotAllowedError";
          trackStatus.textContent = blocked || isAutoplay ? "点一下继续播放" : "音频暂时无法播放";
          if (!isAutoplay || !autoplayBlockedToastShown) {
            showToast(blocked || isAutoplay ? "浏览器限制自动播放，点一下播放即可" : "当前浏览器没有加载到音频文件");
            autoplayBlockedToastShown = true;
          }
          return false;
        }
      }

      function attemptAutoplay() {
        if (autoplayStarted || !audio.paused) return;
        autoplayAttempts += 1;
        trackStatus.textContent = autoplayAttempts === 1 ? "正在自动播放" : "继续尝试播放";
        startAudio(true);
      }

      function scheduleAutoplayRetries() {
        [120, 520, 1300].forEach((delay) => {
          window.setTimeout(attemptAutoplay, delay);
        });
      }

      function stripLrcTimestamps(text) {
        return text
          .split(/\r?\n/)
          .map((line) => line.replace(/^(\[\d{1,2}:\d{2}(?:\.\d{1,3})?\])+/, "").trim())
          .filter(Boolean)
          .join("\n");
      }

      function setLyricsText(text) {
        lyricsText.textContent = text || "请添加授权歌词文件 lyrics.txt 或 lyrics.lrc";
      }

      async function loadLyrics() {
        const sources = [
          { url: "/assets/firefly-gift/lyrics.txt", parser: (text) => text.trim() },
          { url: "/assets/firefly-gift/lyrics.lrc", parser: stripLrcTimestamps },
        ];

        for (const source of sources) {
          try {
            const response = await fetch(source.url, { cache: "no-store" });
            if (!response.ok) continue;
            setLyricsText(source.parser(await response.text()));
            return;
          } catch {
            continue;
          }
        }

        setLyricsText("请添加授权歌词文件 lyrics.txt 或 lyrics.lrc");
      }

      document.querySelector("#copyBtn").addEventListener("click", () => {
        copyText(giftText(false), "文案已复制");
      });

      playBtn.addEventListener("click", async () => {
        if (audio.paused) {
          if (audio.ended) audio.currentTime = 0;
          await startAudio(false);
        } else {
          audio.pause();
        }
      });

      audio.addEventListener("loadedmetadata", () => {
        updateProgress();
        trackStatus.textContent = audio.paused ? "正在自动播放" : "正在播放";
        attemptAutoplay();
      });

      audio.addEventListener("durationchange", updateProgress);

      audio.addEventListener("play", () => {
        autoplayStarted = true;
        setPlayButton(true);
        trackStatus.textContent = "正在播放";
        updateProgress();
      });

      audio.addEventListener("pause", () => {
        if (audio.ended) return;
        setPlayButton(false);
        trackStatus.textContent = audio.currentTime > 0 ? "已暂停" : "点一下继续播放";
        updateProgress();
      });

      audio.addEventListener("timeupdate", updateProgress);

      audio.addEventListener("ended", () => {
        setPlayButton(false);
        updateProgress();
        trackStatus.textContent = "播放完成";
      });

      audio.addEventListener("error", () => {
        trackStatus.textContent = "等待音频文件";
        updateProgress();
      });

      audio.addEventListener("canplay", attemptAutoplay);
      audio.addEventListener("canplaythrough", attemptAutoplay);
      window.addEventListener("load", attemptAutoplay, { once: true });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) attemptAutoplay();
      });

      document.querySelector("#shareBtn").addEventListener("click", async () => {
        const shareData = {
          title: "六一儿童节快乐",
          text: `六一儿童节快乐：${state.msg}`,
          url: currentUrl(),
        };
        if (navigator.share) {
          try {
            await navigator.share(shareData);
          } catch {
            return;
          }
        } else {
          copyText(giftText(true), "分享内容已复制");
        }
      });

      document.querySelector("#customBtn").addEventListener("click", () => {
      applyState();
        editor.showModal();
      });

      document.querySelector("#saveBtn").addEventListener("click", () => {
        state.to = toInput.value.trim() || defaults.to;
        state.msg = msgInput.value.trim() || defaults.msg;
        applyState();
        window.history.replaceState(null, "", currentUrl());
        editor.close();
        showToast("小卡已更新");
      });

      document.querySelector("#copyLinkBtn").addEventListener("click", () => {
        state.to = toInput.value.trim() || defaults.to;
        state.msg = msgInput.value.trim() || defaults.msg;
        applyState();
        window.history.replaceState(null, "", currentUrl());
        copyText(currentUrl(), "链接已复制");
      });
      loadLyrics();
      applyState();
      updateProgress();
      audio.autoplay = true;
      audio.load();
      attemptAutoplay();
      scheduleAutoplayRetries();
    </script>
  </body>
</html>
